name: Build and release Debian package

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Determine release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          base_version="$(sed -n 's/^Version: *//p' debian/DEBIAN/control | head -n 1)"
          latest_tag="$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')"
          latest_version="${latest_tag#subssl_}"
          if [[ "$latest_tag" == "$latest_version" ]]; then
            version="$base_version"
          elif dpkg --compare-versions "$base_version" gt "$latest_version"; then
            version="$base_version"
          else
            IFS=. read -r major minor patch <<< "$latest_version"
            version="$major.$minor.$((patch + 1))"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release version: $version" >&2
            exit 1
          fi
          echo "value=$version" >> "$GITHUB_OUTPUT"

      - name: Build Debian package
        env:
          SUBSSL_VERSION: ${{ steps.version.outputs.value }}
        run: bash ./build-deb.sh

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${{ steps.version.outputs.value }}"
          tag="subssl_${version}"
          gh release create "$tag" dist/*.deb \
            --target "$GITHUB_SHA" \
            --title "$tag" \
            --generate-notes
