name: Feature request
description: Suggest a focused improvement.
title: "feature: "
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: Thanks for sharing an idea for subssl.
  - type: textarea
    id: problem
    attributes:
      label: Problem to solve
      description: What operational problem would this address?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
