[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "subssl"
version = "2.2.3"
description = "TLS certificate inventory and monitoring for NIC.RU DNS zones"
requires-python = ">=3.10"
dependencies = [
  "aiohttp>=3.9,<4",
  "dnspython>=2.6,<3",
  "cryptography>=42,<47",
]

[project.scripts]
subssl = "subssl.cli:main"

[tool.setuptools.packages.find]
include = ["subssl*"]
